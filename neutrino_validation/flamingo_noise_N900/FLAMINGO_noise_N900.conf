#########################################################################################
# monofonIC (wullm/monofonic@output_k_space_slabs) -- FLAMINGO L1000N900 white noise (L1_m10 box)
#
# Copy of ../flamingo_noise/FLAMINGO_noise_N1800.conf with GridRes = 900; same Panphasia
# descriptor and BoxLength (1 cGpc = 673.2 Mpc/h), so the phases are FLAMINGO's.
# GridRes = 900 -> Panphasia relative level 9, N0 = 2 * 2^9 = 1024: writes
#   output_k_space_slab_y.0 ... output_k_space_slab_y.512   (1024^2 complex doubles each, 16 MiB, ~8.6 GB)
# into the working directory. Zeldovich-MPI crops these to N = 900 (|k_i| < 450).
# Only the noise is needed: LPTorder = 1 and the white_noise test (no particle ICs).
# The test's power spectrum hits monofonIC's Compute_PowerSpectrum off-by-one at this GridRes and
# BoxLength (int(kmax/kmin) = 449 while the bin index reaches 449), so monofonIC aborts after the
# slabs are written and mono_N900_white_noise.hdf5 may be missing, as for N1800.
#########################################################################################

[setup]
GridRes         = 900
BoxLength       = 673.2
zstart          = 31.0
LPTorder        = 1
DoBaryons       = no
DoBaryonVrel    = no
DoFixing        = no
DoInversion     = no
ParticleLoad    = sc

[cosmology]
ParameterSet    = none
Omega_c         = 0.265029
Omega_b         = 0.04939
H0              = 67.32
nspec           = 0.96605
A_s             = 2.10058296168115e-9
Tcmb            = 2.7255
k_p             = 0.05
N_ur            = 2.0308
m_nu1           = 0.06
w_0             = -1
w_a             = 0
YHe             = 0.245421
O_nu_norm       = 93.142210639037
deg_nu1         = 1
ZeroRadiation   = false
transfer        = eisenstein

[random]
generator       = PANPHASIA
descriptor      = [Panph6,L18,(56034,71400,250000),S1,KK1025,CH-999,Flamino_Gpc1]

[execution]
NumThreads      = 8

[output]
format          = generic
filename        = ../mono_N900_unused.hdf5
fname_hdf5      = ../mono_N900_white_noise.hdf5
fbase_analysis  = ../mono_N900

[testing]
test            = white_noise
