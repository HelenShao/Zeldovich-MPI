#########################################################################################
# monofonIC (wullm/monofonic@output_k_space_slabs) -- FLAMINGO L1000N1800 white noise
#
# Copy of ../FLAMINGO_test.conf keeping the Panphasia descriptor, GridRes and BoxLength.
# GridRes = 1800 -> Panphasia relative level 10, N0 = 2 * 2^10 = 2048: writes
#   output_k_space_slab_y.0 ... output_k_space_slab_y.1024   (2048^2 complex doubles each, 64 MiB)
# into the working directory. The noise is dimensionless and box independent, so one run serves
# cosm202-206. Only the noise is needed: LPTorder = 1 and the white_noise test (no particle ICs);
# the test also writes monofonIC's own 1800^3 real-space white noise (its crop of the N0 grid),
# used by the N = 1800 crop check. Cosmology/transfer only matter for the unused LPT fields.
# Run with >= 3 MPI ranks: the slab writer's int index overflows if a rank holds > ~1000 y-planes.
#########################################################################################

[setup]
GridRes         = 1800
BoxLength       = 673.2
zstart          = 31.0
LPTorder        = 1
DoBaryons       = no
DoBaryonVrel    = no
DoFixing        = no
DoInversion     = no
ParticleLoad    = sc

[cosmology]
ParameterSet    = none
Omega_c         = 0.265029
Omega_b         = 0.04939
H0              = 67.32
nspec           = 0.96605
A_s             = 2.10058296168115e-9
Tcmb            = 2.7255
k_p             = 0.05
N_ur            = 2.0308
m_nu1           = 0.06
w_0             = -1
w_a             = 0
YHe             = 0.245421
O_nu_norm       = 93.142210639037
deg_nu1         = 1
ZeroRadiation   = false
transfer        = eisenstein

[random]
generator       = PANPHASIA
descriptor      = [Panph6,L18,(56034,71400,250000),S1,KK1025,CH-999,Flamino_Gpc1]

[execution]
NumThreads      = 8

[output]
format          = generic
filename        = ../mono_N1800_unused.hdf5
fname_hdf5      = ../mono_N1800_white_noise.hdf5
fbase_analysis  = ../mono_N1800

[testing]
test            = white_noise
