#########################################################################################
# monofonIC (wullm/monofonic@output_k_space_slabs) -- N = 256 validation run
#
# Same Panphasia realisation as FLAMINGO L1000N1800 (same descriptor, same box),
# at GridRes = 256 so that N0 = 2 * 2^7 = 256 = N (no cropping, small files).
#
# Writes into the working directory:
#   output_k_space_slab_y.0 ... output_k_space_slab_y.128   (unit white noise, [x][z], double)
#   mono_N256_delta.hdf5  (dataset "delta": first-order density, used by test 3)
# Testing mode: no particle ICs are written.
#########################################################################################

[setup]
GridRes         = 256
BoxLength       = 673.2
zstart          = 31.0
LPTorder        = 1
DoBaryons       = no
DoBaryonVrel    = no
DoFixing        = no
DoInversion     = no
ParticleLoad    = sc

[cosmology]
ParameterSet    = none
Omega_c         = 0.265029
Omega_b         = 0.04939
H0              = 67.32
nspec           = 0.96605
A_s             = 2.10058296168115e-9
Tcmb            = 2.7255
k_p             = 0.05
N_ur            = 2.0308
m_nu1           = 0.06
w_0             = -1
w_a             = 0
YHe             = 0.245421
O_nu_norm       = 93.142210639037
deg_nu1         = 1
ZeroRadiation   = false

# Only the white noise and the phases matter for tests 1 and 3, so no CLASS/zwindstroom needed.
transfer        = eisenstein

[random]
generator       = PANPHASIA
descriptor      = [Panph6,L18,(56034,71400,250000),S1,KK1025,CH-999,Flamino_Gpc1]

[execution]
NumThreads      = 8

[output]
format          = generic
filename        = mono_N256_unused.hdf5
fname_hdf5      = mono_N256_delta.hdf5

[testing]
test            = potentials_and_densities
