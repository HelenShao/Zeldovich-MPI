#########################################################################################
# monofonIC (wullm/monofonic@output_k_space_slabs) -- emulator-box white noise (1215 Mpc/h, 4480^3)
#
# Copy of ../flamingo_noise/FLAMINGO_noise_N1800.conf for the AbacusAurora emulator box
# (Simulations/Emulator*.par2: BoxSize = 1215, NP = 4480**3).
# GridRes = 4480 -> Panphasia relative level 12, N0 = 2 * 2^12 = 8192: writes
#   output_k_space_slab_y.0 ... output_k_space_slab_y.4096   (8192^2 complex doubles each, 1 GiB, ~4.4 TB)
# into the working directory. Zeldovich-MPI crops these to N = 4480 (|k_i| < 2240).
#
# Descriptor: NOT FLAMINGO's. Same form (S1 cube at level 18) with a different cube origin, so the
# phases are independent of FLAMINGO's. Unregistered, internal use only (CH-999 turns off the
# check digit); replace with a registered Panphasia descriptor before publication if needed.
# KK1025 is kept from FLAMINGO's form: modes with k^2 <= 1025 (fundamental units) get |w| = 1
# (amplitude-fixed, random phase). Drop ",KK1025" for fully Gaussian low-k modes.
#
# Only the noise is needed: LPTorder = 1 and the white_noise test (no particle ICs). The test also
# writes monofonIC's 4480^3 real-space white noise (~720 GB double) to ../mono_N4480_white_noise.hdf5.
# GridRes 4480 at BoxLength 1215 does not hit the Compute_PowerSpectrum off-by-one (kmax/kmin = 2240).
# The slab writer indexes with int: each rank must hold < 64 y-planes of the 8192 grid, i.e. >= 129
# MPI ranks (the PBS script uses 1024 on 128 nodes: 16 nodes ran out of memory at ~18 TB).
#########################################################################################

[setup]
GridRes         = 4480
BoxLength       = 1215.0
zstart          = 99.0
LPTorder        = 1
DoBaryons       = no
DoBaryonVrel    = no
DoFixing        = no
DoInversion     = no
ParticleLoad    = sc

[cosmology]
ParameterSet    = none
Omega_c         = 0.265029
Omega_b         = 0.04939
H0              = 67.32
nspec           = 0.96605
A_s             = 2.10058296168115e-9
Tcmb            = 2.7255
k_p             = 0.05
N_ur            = 2.0308
m_nu1           = 0.06
w_0             = -1
w_a             = 0
YHe             = 0.245421
O_nu_norm       = 93.142210639037
deg_nu1         = 1
ZeroRadiation   = false
transfer        = eisenstein

[random]
generator       = PANPHASIA
descriptor      = [Panph6,L18,(140213,37919,201577),S1,KK1025,CH-999,Abacus_emu1215]

[execution]
NumThreads      = 12

[output]
format          = generic
filename        = ../mono_N4480_unused.hdf5
fname_hdf5      = ../mono_N4480_white_noise.hdf5
fbase_analysis  = ../mono_N4480

[testing]
test            = white_noise
